services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: home_shine
      POSTGRES_USER: home_shine
      POSTGRES_PASSWORD: home_shine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_shine -d home_shine"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

volumes:
  postgres_data:
